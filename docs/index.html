<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Moderation System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Vibrant Neon Gradient Theme */
      --primary: #7f53ac;
      --primary2: #647dee;
      --secondary: #ff6a88;
      --secondary2: #ff99ac;
      --success: #32ff7e;
      --danger: #ff5757;
      --warning: #ffe156;
      --info: #62d2ff;
      --dark: #1b1b33;
      --light: #ffffff;
      --glass-bg: rgba(255,255,255,0.22);
      --glass-bg-dark: rgba(40,35,60,0.65);
      --shadow: 0 8px 32px 0 rgba(31,38,135,0.22);
      --shadow-strong: 0 16px 48px 0 rgba(80,0,160,0.18);
      --border-glass: 1.5px solid rgba(255,255,255,0.16);
      --gradient-primary: linear-gradient(135deg, #7f53ac 0%, #647dee 100%);
      --gradient-accent: linear-gradient(135deg, #ff6a88 0%, #ff99ac 100%);
      --gradient-success: linear-gradient(135deg, #32ff7e 0%, #00d2ff 100%);
      --gradient-danger: linear-gradient(135deg, #ff5757 0%, #ff99ac 100%);
    }
    [data-theme="dark"] {
      --glass-bg: rgba(35,30,55,0.76);
      --glass-bg-dark: rgba(20,17,35,0.92);
      --light: #20203a;
      --dark: #f0f0fa;
      --primary: #bcb6fc;
      --primary2: #647dee;
      --secondary: #ffb0c2;
      --secondary2: #ff99ac;
      --success: #53ffa5;
      --danger: #ff3b69;
      --gradient-primary: linear-gradient(135deg, #bcb6fc 0%, #647dee 100%);
      --gradient-accent: linear-gradient(135deg, #ff6a88 0%, #ff99ac 100%);
      --gradient-success: linear-gradient(135deg, #32ff7e 0%, #00d2ff 100%);
      --gradient-danger: linear-gradient(135deg, #ff5757 0%, #ff99ac 100%);
    }
    html, body {
      margin: 0; padding: 0;
      font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--dark);
      min-height: 100vh;
      color: var(--light);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0;
      background:
        radial-gradient(circle at 80vw 20vh, #ff6a88 0%, transparent 60%),
        radial-gradient(circle at 10vw 90vh, #647dee 0%, transparent 70%),
        radial-gradient(circle at 50vw 50vh, #32ff7e 0%, transparent 80%),
        linear-gradient(120deg, #1b1b33 0%, #28205a 100%);
      opacity: 0.78;
      pointer-events: none;
      filter: blur(6px);
    }

    .floating-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(32px);
      opacity: 0.18;
      z-index: 1;
      animation: floatShape 10s infinite ease-in-out alternate;
    }
    .shape1 { width: 260px; height: 260px; background: var(--gradient-primary); top: -80px; left: -80px; animation-delay: 0s;}
    .shape2 { width: 320px; height: 320px; background: var(--gradient-accent); bottom: 0; right: -90px; animation-delay: 2.5s;}
    .shape3 { width: 180px; height: 180px; background: var(--gradient-success); top: 33vh; right: 15vw; animation-delay: 1.2s;}
    @keyframes floatShape {
      0% {transform: translateY(0) scale(1);}
      60% {transform: translateY(-40px) scale(1.07);}
      100% {transform: translateY(0) scale(1);}
    }

    .container {
      max-width: 620px;
      margin: 0 auto;
      padding: 2.8rem 1.2rem 2.2rem 1.2rem;
      position: relative;
      z-index: 2;
    }

    /* HEADER */
    header {
      text-align: center;
      padding-top: 2rem;
      margin-bottom: 2.5rem;
      animation: fadeInDown 1s cubic-bezier(.42,0,.58,1);
      position: relative;
    }
    .theme-toggle {
      position: absolute;
      top: 4px;
      right: 16px;
      background: var(--glass-bg);
      border: var(--border-glass);
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 18px 0 rgba(120,80,230,0.12);
      transition: all 0.22s cubic-bezier(.42,0,.58,1);
      color: var(--primary2);
      backdrop-filter: blur(8px);
      font-size: 1.3rem;
      z-index: 3;
    }
    .theme-toggle:hover { background: var(--gradient-primary); color: #fff; transform: scale(1.10); }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.2rem;
      animation: floatLogo 4s ease-in-out infinite;
    }
    @keyframes floatLogo {
      0%, 100% {transform: translateY(0);}
      50% {transform: translateY(-8px);}
    }
    .logo i {
      font-size: 3.2rem;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 8px rgba(127,83,172,0.38));
    }
    h1 {
      font-size: 2.35rem;
      font-weight: 900;
      letter-spacing: -.5px;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.3rem;
      text-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .subtitle {
      color: var(--light);
      font-size: 1.17rem;
      font-weight: 500;
      max-width: 430px;
      margin: 0 auto 0.7rem auto;
      padding: 0.3rem 1rem;
      border-radius: 6px;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(2px);
      box-shadow: 0 3px 16px 0 rgba(100,100,180,0.06);
      display: inline-block;
      position: relative;
      z-index: 1;
    }
    .subtitle::after {
      content: '';
      display: block;
      margin: 0.7rem auto 0 auto;
      border-radius: 3px;
      width: 70px; height: 4px;
      background: var(--gradient-primary);
      opacity: 0.94;
    }

    /* UPLOAD AREA */
    .upload-area {
      background: var(--glass-bg);
      border-radius: 24px;
      box-shadow: var(--shadow-strong);
      padding: 2.5rem 1.2rem 2.2rem 1.2rem;
      margin-bottom: 2.2rem;
      border: var(--border-glass);
      position: relative;
      overflow: visible;
      backdrop-filter: blur(16px);
      transition: box-shadow 0.4s cubic-bezier(.42,0,.58,1);
      animation: fadeInUp 1.2s cubic-bezier(.42,0,.58,1);
    }

    .upload-area::before {
      content: '';
      position: absolute;
      top: -1.5rem; left: 50%;
      transform: translateX(-50%);
      width: 120px; height: 14px;
      background: var(--gradient-primary);
      filter: blur(16px);
      opacity: 0.16;
      border-radius: 8px;
      z-index: 0;
    }
    .upload-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.2rem 0.5rem;
      border: 2.3px dashed var(--primary2);
      border-radius: 16px;
      background: rgba(100,125,238,0.08);
      backdrop-filter: blur(3px);
      min-height: 220px;
      width: 100%;
      position: relative;
      transition: border-color 0.3s, box-shadow 0.3s;
      z-index: 1;
    }
    .upload-container.active {
      border-color: var(--secondary);
      background: rgba(255,106,136,0.07);
      animation: pulseGlow 1.6s infinite;
      box-shadow: 0 0 12px 2px var(--secondary);
    }
    @keyframes pulseGlow {
      0%,100% { box-shadow: 0 0 12px 2px var(--secondary);}
      60% {box-shadow: 0 0 32px 8px var(--secondary2);}
    }
    .upload-icon {
      font-size: 3.8rem;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(255,106,136,0.21));
      margin-bottom: 1.1rem;
      animation: floatLogo 3s ease-in-out infinite;
    }
    .upload-text {
      text-align: center;
      margin-bottom: 1.6rem;
    }
    .upload-text h3 {
      font-size: 1.22rem;
      color: var(--primary2);
      margin-bottom: 0.45rem;
      font-weight: 700;
      letter-spacing: 0.1px;
    }
    .upload-text p {
      color: var(--light);
      font-size: 0.97rem;
      opacity: 0.82;
    }
    .file-input { display: none; }

    /* BUTTONS */
    .btn {
      background: var(--gradient-primary);
      color: #fff;
      border: none;
      padding: 0.82rem 2.35rem;
      border-radius: 999px;
      font-size: 1.09rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(.42,0,.58,1);
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      box-shadow: 0 3px 18px 0 rgba(127,83,172,0.23), 0 1.5px 7px 0 rgba(255,106,136,0.12);
      position: relative;
      overflow: hidden;
      outline: none;
      margin-top: 8px;
      z-index: 2;
    }
    .btn::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, #ff6a88 0%, #647dee 100%);
      opacity: 0;
      transition: opacity 0.3s;
      z-index: -1;
    }
    .btn:hover, .btn:focus {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 8px 28px 0 rgba(127,83,172,0.32), 0 2.5px 13px 0 rgba(255,106,136,0.16);
    }
    .btn:hover::before, .btn:focus::before { opacity: 0.13; }
    .btn:active { transform: scale(0.98);}
    .btn i { font-size: 1.11rem; }

    /* PREVIEW */
    .preview-container {
      margin-top: 2rem;
      text-align: center;
      animation: fadeIn 1.0s cubic-bezier(.42,0,.58,1);
      position: relative;
    }
    .preview-image {
      max-width: 99%;
      max-height: 320px;
      border-radius: 22px;
      box-shadow: 0 8px 32px 0 rgba(120,80,230,0.19);
      border: 1.6px solid var(--primary2);
      background: var(--light);
      object-fit: contain;
      transition: all 0.36s cubic-bezier(.42,0,.58,1);
    }
    .preview-image:hover {
      transform: scale(1.03) rotate(-2deg);
      box-shadow: 0 12px 44px 0 rgba(255,106,136,0.23);
    }

    /* RESULT CARD */
    .result-container {
      margin-top: 2.2rem;
      animation: fadeInUp 1.1s cubic-bezier(.42,0,.58,1);
    }
    .result-card {
      background: var(--glass-bg-dark);
      border-radius: 24px;
      box-shadow: var(--shadow-strong);
      padding: 2.2rem 1.1rem;
      border: var(--border-glass);
      transition: box-shadow 0.3s, border 0.3s, background 0.3s;
      text-align: center;
      position: relative;
      overflow: visible;
      min-height: 144px;
      max-width: 500px;
      margin: 0 auto;
      z-index: 1;
    }
    .result-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 8px; height: 100%;
      border-radius: 12px;
      transition: background 0.3s;
      z-index: 0;
    }
    .safe .result-card::before { background: var(--gradient-success); }
    .prohibited .result-card::before { background: var(--gradient-danger);}
    .result-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      margin-bottom: 1.1rem;
      position: relative;
      z-index: 2;
    }
    .result-icon {
      font-size: 3.2rem;
      width: 76px; height: 76px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 28px 0 rgba(127,83,172,0.17);
      background: var(--gradient-primary);
      color: #fff;
      margin-bottom: 0.1rem;
      transition: background 0.3s;
    }
    .safe .result-icon { background: var(--gradient-success);}
    .prohibited .result-icon { background: var(--gradient-danger);}
    .result-title {
      font-size: 1.37rem;
      font-weight: 800;
      color: var(--light);
      margin-bottom: 0.2rem;
      letter-spacing: -0.5px;
    }
    .result-message {
      margin-top: 0.7rem;
      color: var(--primary2);
      font-size: 1.09rem;
      font-weight: 600;
      line-height: 1.65;
      text-shadow: 0 0 6px rgba(100,125,238,0.09);
    }
    .prohibited .result-message { color: var(--danger);}
    .safe .result-message { color: var(--success);}
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.7rem;
      padding: 3.5rem 0.2rem;
      background: var(--glass-bg-dark);
      border-radius: 18px;
      box-shadow: 0 2px 18px 0 rgba(100,125,238,0.07);
      border: var(--border-glass);
    }
    .spinner {
      width: 54px; height: 54px;
      border: 5px solid rgba(100,125,238,0.13);
      border-top: 5px solid var(--primary2);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      position: relative;
      box-shadow: 0 0 12px 2px var(--primary2);
    }
    .spinner::after {
      content: '';
      position: absolute;
      top: -6px; left: -6px; right: -6px; bottom: -6px;
      border: 4px solid transparent;
      border-top: 4px solid var(--secondary);
      border-radius: 50%;
      animation: spin 1.5s linear infinite;
    }
    .loading-text {
      color: var(--primary2);
      font-weight: 700;
      font-size: 1.08rem;
      letter-spacing: .04em;
      text-shadow: 0 0 12px rgba(100,125,238,0.07);
      position: relative;
    }
    .loading-text::after {
      content: '...';
      position: absolute;
      animation: dots 1.5s infinite steps(4, end);
    }
    .hidden { display: none !important; }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0;}
      to { opacity: 1;}
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(44px);}
      to { opacity: 1; transform: translateY(0);}
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-32px);}
      to { opacity: 1; transform: translateY(0);}
    }
    @keyframes spin {
      0% { transform: rotate(0deg);}
      100% { transform: rotate(360deg);}
    }
    @keyframes dots {
      0%, 20% { content: '.';}
      40% { content: '..';}
      60%, 100% { content: '...';}
    }
    /* Responsive */
    @media (max-width: 760px) {
      .container { padding: 1.2rem 0.1rem;}
      .upload-area { padding: 1.1rem 0.2rem;}
      .result-card { padding: 1.25rem 0.5rem;}
      h1 { font-size: 1.35rem;}
      .upload-container { padding: 1.1rem 0.1rem;}
      .shape1, .shape2, .shape3 { display: none;}
    }
  </style>
</head>
<body>
  <!-- Vibrant floating background shapes -->
  <div class="floating-shape shape1"></div>
  <div class="floating-shape shape2"></div>
  <div class="floating-shape shape3"></div>

  <div class="container">
    <header>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <i class="fas fa-moon"></i>
      </button>
      <div class="logo">
        <i class="fas fa-shield-alt"></i>
        <h1>Image Moderation System</h1>
      </div>
      <p class="subtitle">Upload images to automatically detect prohibited content using advanced AI moderation</p>
    </header>
    <main>
      <div class="upload-area">
        <div class="upload-container" id="uploadContainer">
          <i class="fas fa-cloud-upload-alt upload-icon"></i>
          <div class="upload-text">
            <h3>Drag & Drop your image here</h3>
            <p>or click to browse files (JPEG, PNG, GIF)</p>
          </div>
          <button class="btn" id="uploadBtn">
            <i class="fas fa-upload"></i> Select Image
          </button>
          <input type="file" id="imageInput" class="file-input" accept="image/*">
        </div>
        <div class="preview-container hidden" id="previewContainer">
          <img id="previewImage" class="preview-image" src="#" alt="Preview">
        </div>
      </div>
      <div class="result-container">
        <div class="result-card hidden" id="resultCard">
          <div class="result-header">
            <div class="result-icon" id="resultIcon">
              <i class="fas fa-check"></i>
            </div>
            <div>
              <h3 class="result-title" id="resultTitle">Analysis Complete</h3>
              <p class="result-message" id="resultMessage">This image meets our content guidelines</p>
            </div>
          </div>
        </div>
        <div class="loading hidden" id="loadingIndicator">
          <div class="spinner"></div>
          <p class="loading-text">Analyzing image content</p>
        </div>
      </div>
    </main>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Theme toggle functionality
      const themeToggle = document.getElementById('themeToggle');
      const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');
      const currentTheme = localStorage.getItem('theme');
      // Set initial theme
      if (currentTheme === 'dark' || (!currentTheme && prefersDarkScheme.matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
      }
      themeToggle.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        if (currentTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'light');
          localStorage.setItem('theme', 'light');
          themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          localStorage.setItem('theme', 'dark');
          themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
        }
      });

      // Image upload functionality
      const uploadContainer = document.getElementById('uploadContainer');
      const uploadBtn = document.getElementById('uploadBtn');
      const imageInput = document.getElementById('imageInput');
      const previewContainer = document.getElementById('previewContainer');
      const previewImage = document.getElementById('previewImage');
      const resultCard = document.getElementById('resultCard');
      const resultIcon = document.getElementById('resultIcon');
      const resultTitle = document.getElementById('resultTitle');
      const resultMessage = document.getElementById('resultMessage');
      const loadingIndicator = document.getElementById('loadingIndicator');

      // Handle drag and drop
      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        uploadContainer.addEventListener(eventName, preventDefaults, false);
      });
      function preventDefaults(e) {
        e.preventDefault(); e.stopPropagation();
      }
      ['dragenter', 'dragover'].forEach(eventName => {
        uploadContainer.addEventListener(eventName, highlight, false);
      });
      ['dragleave', 'drop'].forEach(eventName => {
        uploadContainer.addEventListener(eventName, unhighlight, false);
      });
      function highlight() { uploadContainer.classList.add('active'); }
      function unhighlight() { uploadContainer.classList.remove('active'); }
      uploadContainer.addEventListener('drop', handleDrop, false);
      function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files.length) {
          imageInput.files = files;
          handleFiles(files);
        }
      }
      uploadBtn.addEventListener('click', () => { imageInput.click(); });
      imageInput.addEventListener('change', () => {
        if (imageInput.files.length) {
          handleFiles(imageInput.files);
        }
      });
      async function handleFiles(files) {
        const file = files[0];
        if (!file.type.match('image.*')) {
          showError('Please select an image file (JPEG, PNG, GIF)');
          return;
        }
        // Show preview
        const reader = new FileReader();
        reader.onload = (e) => {
          previewImage.src = e.target.result;
          previewContainer.classList.remove('hidden');
          previewContainer.style.animation = 'fadeIn 0.8s cubic-bezier(.42,0,.58,1)';
        };
        reader.readAsDataURL(file);
        // Reset UI
        resultCard.classList.add('hidden');
        loadingIndicator.classList.remove('hidden');
        // Prepare form data
        const formData = new FormData();
        formData.append("file", file);
        try {
          // Simulate API call with timeout
          await new Promise(resolve => setTimeout(resolve, 2500));
          // For demo purposes, randomly determine if the image is safe or not
          const isSafe = Math.random() > 0.3;
          const data = { status: isSafe ? "Safe" : "Prohibited" };
          displayResult(data.status);
        } catch (error) {
          showError(error.message || "An error occurred while processing the image");
        } finally {
          loadingIndicator.classList.add('hidden');
        }
      }
      function displayResult(status) {
        // Set result card style based on status
        resultCard.className = status === "Safe" ?
          "result-card safe" : "result-card prohibited";
        // Set icon and title
        const icon = resultIcon.querySelector('i');
        if (status === "Safe") {
          icon.className = "fas fa-check-circle";
          resultTitle.textContent = "✅ Image Approved";
          resultMessage.textContent = "This image meets our content guidelines and is safe for use.";
        } else {
          icon.className = "fas fa-exclamation-circle";
          resultTitle.textContent = "⛔ Content Violation Detected";
          resultMessage.textContent = "This image contains prohibited content that violates our guidelines.";
        }
        // Show result card with animation
        resultCard.classList.remove('hidden');
        resultCard.style.animation = 'fadeInUp 0.8s cubic-bezier(.42,0,.58,1)';
      }
      function showError(message) {
        resultCard.className = "result-card prohibited";
        const icon = resultIcon.querySelector('i');
        icon.className = "fas fa-times-circle";
        resultTitle.textContent = "⚠️ Error Processing Image";
        resultMessage.textContent = message;
        resultCard.classList.remove('hidden');
        resultCard.style.animation = 'fadeInUp 0.8s cubic-bezier(.42,0,.58,1)';
      }
    });
  </script>
</body>
</html>
