<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Moderation System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #6c5ce7;
      --primary-dark: #5649c0;
      --primary-light: #a29bfe;
      --secondary: #fd79a8;
      --success: #00b894;
      --danger: #d63031;
      --warning: #fdcb6e;
      --info: #0984e3;
      --light: #f8f9fa;
      --dark: #2d3436;
      --gray: #636e72;
      --light-gray: #dfe6e9;
      --gradient-primary: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
      --gradient-danger: linear-gradient(135deg, #d63031 0%, #ff7675 100%);
      --gradient-success: linear-gradient(135deg, #00b894 0%, #55efc4 100%);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f7fb;
      background-image: radial-gradient(circle at 10% 20%, rgba(166, 177, 255, 0.1) 0%, rgba(255, 255, 255, 1) 90%);
      color: var(--dark);
      line-height: 1.6;
      min-height: 100vh;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    header {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeInDown 0.8s ease-out;
    }
    
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      margin-bottom: 1rem;
    }
    
    .logo i {
      font-size: 2.5rem;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 4px rgba(108, 92, 231, 0.3));
    }
    
    h1 {
      font-size: 2.2rem;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    
    .subtitle {
      color: var(--gray);
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto;
      position: relative;
      display: inline-block;
    }
    
    .subtitle::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: var(--gradient-primary);
      border-radius: 3px;
    }
    
    .upload-area {
      background: white;
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
      margin-bottom: 2rem;
      border: none;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
      animation: fadeInUp 0.8s ease-out 0.2s both;
      position: relative;
      overflow: hidden;
    }
    
    .upload-area::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: var(--gradient-primary);
    }
    
    .upload-area:hover {
      transform: translateY(-8px) scale(1.01);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
    }
    
    .upload-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem;
      border: 2px dashed var(--light-gray);
      border-radius: 12px;
      transition: all 0.3s ease;
      position: relative;
      min-height: 250px;
      background-color: rgba(240, 242, 255, 0.5);
    }
    
    .upload-container.active {
      border-color: var(--primary);
      background-color: rgba(166, 177, 255, 0.15);
      animation: pulseBorder 1.5s infinite;
    }
    
    .upload-icon {
      font-size: 3.5rem;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.2rem;
      transition: all 0.3s ease;
      filter: drop-shadow(0 4px 8px rgba(108, 92, 231, 0.2));
    }
    
    .upload-text {
      text-align: center;
      margin-bottom: 1.8rem;
    }
    
    .upload-text h3 {
      font-size: 1.3rem;
      color: var(--dark);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    
    .upload-text p {
      color: var(--gray);
      font-size: 0.95rem;
    }
    
    .file-input {
      display: none;
    }
    
    .btn {
      background: var(--gradient-primary);
      color: white;
      border: none;
      padding: 1rem 2.2rem;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
      position: relative;
      overflow: hidden;
      z-index: 1;
    }
    
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #5649c0 0%, #6c5ce7 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: -1;
    }
    
    .btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 25px rgba(108, 92, 231, 0.4);
    }
    
    .btn:hover::before {
      opacity: 1;
    }
    
    .btn:active {
      transform: translateY(1px);
    }
    
    .btn i {
      font-size: 1.1rem;
    }
    
    .preview-container {
      margin-top: 2rem;
      text-align: center;
      animation: fadeIn 0.8s ease-out;
      position: relative;
    }
    
    .preview-image {
      max-width: 100%;
      max-height: 350px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
      border: none;
      object-fit: contain;
    }
    
    .preview-image:hover {
      transform: scale(1.03);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }
    
    .result-container {
      margin-top: 2rem;
      animation: fadeInUp 0.8s ease-out;
    }
    
    .result-card {
      background: white;
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .result-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
      transition: all 0.4s ease;
    }
    
    .safe .result-card::before {
      background: var(--gradient-success);
    }
    
    .prohibited .result-card::before {
      background: var(--gradient-danger);
    }
    
    .result-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
    }
    
    .result-icon {
      font-size: 3.5rem;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
    }
    
    .safe .result-icon {
      background: var(--gradient-success);
      color: white;
    }
    
    .prohibited .result-icon {
      background: var(--gradient-danger);
      color: white;
    }
    
    .result-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 0.5rem;
    }
    
    .result-message {
      margin-top: 1.2rem;
      color: var(--gray);
      font-size: 1.1rem;
      line-height: 1.7;
    }
    
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 3rem;
      background: white;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
    }
    
    .spinner {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(108, 92, 231, 0.1);
      border-top: 5px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      position: relative;
    }
    
    .spinner::after {
      content: '';
      position: absolute;
      top: -5px;
      left: -5px;
      right: -5px;
      bottom: -5px;
      border: 5px solid transparent;
      border-top: 5px solid var(--primary-light);
      border-radius: 50%;
      animation: spin 1.5s linear infinite;
    }
    
    .loading-text {
      color: var(--gray);
      font-weight: 500;
      font-size: 1.1rem;
      position: relative;
    }
    
    .loading-text::after {
      content: '...';
      position: absolute;
      animation: dots 1.5s infinite steps(4, end);
    }
    
    .hidden {
      display: none;
    }
    
    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes pulseBorder {
      0% { box-shadow: 0 0 0 0 rgba(108, 92, 231, 0.2); }
      70% { box-shadow: 0 0 0 15px rgba(108, 92, 231, 0); }
      100% { box-shadow: 0 0 0 0 rgba(108, 92, 231, 0); }
    }
    
    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }
    
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 1.5rem;
      }
      
      .upload-area {
        padding: 1.8rem;
      }
      
      h1 {
        font-size: 1.8rem;
      }
      
      .upload-container {
        padding: 1.8rem;
        min-height: 220px;
      }
      
      .result-card {
        padding: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <i class="fas fa-shield-alt"></i>
        <h1>Image Moderation System</h1>
      </div>
      <p class="subtitle">Upload images to automatically detect prohibited content using advanced AI moderation</p>
    </header>
    
    <main>
      <div class="upload-area">
        <div class="upload-container" id="uploadContainer">
          <i class="fas fa-cloud-upload-alt upload-icon"></i>
          <div class="upload-text">
            <h3>Drag & Drop your image here</h3>
            <p>or click to browse files (JPEG, PNG, GIF)</p>
          </div>
          <button class="btn" id="uploadBtn">
            <i class="fas fa-upload"></i> Select Image
          </button>
          <input type="file" id="imageInput" class="file-input" accept="image/*">
        </div>
        
        <div class="preview-container hidden" id="previewContainer">
          <img id="previewImage" class="preview-image" src="#" alt="Preview">
        </div>
      </div>
      
      <div class="result-container">
        <div class="result-card hidden" id="resultCard">
          <div class="result-header">
            <div class="result-icon" id="resultIcon">
              <i class="fas fa-check"></i>
            </div>
            <div>
              <h3 class="result-title" id="resultTitle">Analysis Complete</h3>
              <p class="result-message" id="resultMessage">This image meets our content guidelines</p>
            </div>
          </div>
        </div>
        
        <div class="loading hidden" id="loadingIndicator">
          <div class="spinner"></div>
          <p class="loading-text">Analyzing image content</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const uploadContainer = document.getElementById('uploadContainer');
      const uploadBtn = document.getElementById('uploadBtn');
      const imageInput = document.getElementById('imageInput');
      const previewContainer = document.getElementById('previewContainer');
      const previewImage = document.getElementById('previewImage');
      const resultCard = document.getElementById('resultCard');
      const resultIcon = document.getElementById('resultIcon');
      const resultTitle = document.getElementById('resultTitle');
      const resultMessage = document.getElementById('resultMessage');
      const loadingIndicator = document.getElementById('loadingIndicator');
      
      // Handle drag and drop
      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        uploadContainer.addEventListener(eventName, preventDefaults, false);
      });
      
      function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
      }
      
      ['dragenter', 'dragover'].forEach(eventName => {
        uploadContainer.addEventListener(eventName, highlight, false);
      });
      
      ['dragleave', 'drop'].forEach(eventName => {
        uploadContainer.addEventListener(eventName, unhighlight, false);
      });
      
      function highlight() {
        uploadContainer.classList.add('active');
      }
      
      function unhighlight() {
        uploadContainer.classList.remove('active');
      }
      
      uploadContainer.addEventListener('drop', handleDrop, false);
      
      function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files.length) {
          imageInput.files = files;
          handleFiles(files);
        }
      }
      
      uploadBtn.addEventListener('click', () => {
        imageInput.click();
      });
      
      imageInput.addEventListener('change', () => {
        if (imageInput.files.length) {
          handleFiles(imageInput.files);
        }
      });
      
      async function handleFiles(files) {
        const file = files[0];
        if (!file.type.match('image.*')) {
          showError('Please select an image file (JPEG, PNG, GIF)');
          return;
        }
        
        // Show preview
        const reader = new FileReader();
        reader.onload = (e) => {
          previewImage.src = e.target.result;
          previewContainer.classList.remove('hidden');
          previewContainer.style.animation = 'fadeIn 0.8s ease-out';
        };
        reader.readAsDataURL(file);
        
        // Reset UI
        resultCard.classList.add('hidden');
        loadingIndicator.classList.remove('hidden');
        
        // Prepare form data
        const formData = new FormData();
        formData.append("file", file);
        
        try {
          // Simulate API call with timeout
          await new Promise(resolve => setTimeout(resolve, 2500));
          
          // For demo purposes, we'll randomly determine if the image is safe or not
          const isSafe = Math.random() > 0.3;
          const data = { status: isSafe ? "Safe" : "Prohibited" };
          
          displayResult(data.status);
        } catch (error) {
          showError(error.message || "An error occurred while processing the image");
        } finally {
          loadingIndicator.classList.add('hidden');
        }
      }
      
      function displayResult(status) {
        // Set result card style based on status
        resultCard.className = status === "Safe" ? 
          "result-card safe" : "result-card prohibited";
        
        // Set icon and title
        const icon = resultIcon.querySelector('i');
        if (status === "Safe") {
          icon.className = "fas fa-check-circle";
          resultTitle.textContent = "✅ Image Approved";
          resultMessage.textContent = "This image meets our content guidelines and is safe for use.";
        } else {
          icon.className = "fas fa-exclamation-circle";
          resultTitle.textContent = "⛔ Content Violation Detected";
          resultMessage.textContent = "This image contains prohibited content that violates our guidelines.";
        }
        
        // Show result card with animation
        resultCard.classList.remove('hidden');
        resultCard.style.animation = 'fadeInUp 0.8s ease-out';
      }
      
      function showError(message) {
        resultCard.className = "result-card prohibited";
        const icon = resultIcon.querySelector('i');
        icon.className = "fas fa-times-circle";
        resultTitle.textContent = "⚠️ Error Processing Image";
        resultMessage.textContent = message;
        
        resultCard.classList.remove('hidden');
        resultCard.style.animation = 'fadeInUp 0.8s ease-out';
      }
    });
  </script>
</body>
</html>
