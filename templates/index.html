<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image Moderation System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Professional Color Scheme */
      --primary: #4361ee;
      --primary-light: #4895ef;
      --primary-dark: #3f37c9;
      --secondary: #f72585;
      --accent: #4cc9f0;
      --success: #4ade80;
      --warning: #f59e0b;
      --danger: #ef4444;
      --dark: #111827;
      --darker: #0f172a;
      --light: #f8fafc;
      --lighter: #ffffff;
      --gray: #64748b;
      --gray-light: #e2e8f0;
      --border-radius: 12px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --dark: #f8fafc;
      --darker: #f1f5f9;
      --light: #1e293b;
      --lighter: #0f172a;
      --gray: #94a3b8;
      --gray-light: #334155;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--light);
      color: var(--dark);
      line-height: 1.6;
      min-height: 100vh;
      transition: var(--transition);
    }

    /* Animated Background */
    .bg-pattern {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.05;
      background-image: 
        radial-gradient(circle at 10% 20%, var(--primary) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, var(--secondary) 0%, transparent 20%),
        radial-gradient(circle at 50% 50%, var(--accent) 0%, transparent 30%);
      animation: moveBackground 30s infinite alternate;
    }

    @keyframes moveBackground {
      0% {
        transform: translate(0, 0);
      }
      100% {
        transform: translate(20px, 20px);
      }
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 3rem;
      position: relative;
      animation: fadeInDown 0.8s ease-out;
    }

    .theme-toggle {
      position: absolute;
      top: 0;
      right: 0;
      background: var(--lighter);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      color: var(--dark);
    }

    .theme-toggle:hover {
      transform: scale(1.1);
      box-shadow: var(--shadow);
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .logo-icon {
      font-size: 2.5rem;
      color: var(--primary);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
      100% {
        transform: scale(1);
      }
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--gray);
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Upload Area */
    .upload-area {
      background: var(--lighter);
      border-radius: var(--border-radius);
      padding: 2.5rem;
      box-shadow: var(--shadow-lg);
      margin-bottom: 2rem;
      transition: var(--transition);
      animation: fadeInUp 0.8s ease-out 0.2s both;
      border: 1px solid var(--gray-light);
    }

    .upload-area:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-xl);
    }

    .upload-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      border: 2px dashed var(--gray-light);
      border-radius: var(--border-radius);
      transition: var(--transition);
      position: relative;
      min-height: 200px;
      background-color: rgba(67, 97, 238, 0.03);
    }

    .upload-container.active {
      border-color: var(--primary);
      background-color: rgba(67, 97, 238, 0.05);
      animation: pulse 1.5s infinite;
    }

    .upload-icon {
      font-size: 3rem;
      color: var(--primary);
      margin-bottom: 1rem;
      transition: var(--transition);
    }

    .upload-text {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .upload-text h3 {
      font-size: 1.2rem;
      color: var(--dark);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .upload-text p {
      color: var(--gray);
      font-size: 0.9rem;
    }

    .file-input {
      display: none;
    }

    /* Buttons */
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.8rem 1.8rem;
      border-radius: var(--border-radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: var(--shadow);
    }

    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn i {
      font-size: 1rem;
    }

    /* Preview */
    .preview-container {
      margin-top: 2rem;
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }

    .preview-image {
      max-width: 100%;
      max-height: 300px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      transition: var(--transition);
      border: 1px solid var(--gray-light);
    }

    .preview-image:hover {
      transform: scale(1.02);
      box-shadow: var(--shadow-md);
    }

    /* Results */
    .result-container {
      margin-top: 2rem;
      animation: fadeInUp 0.8s ease-out;
    }

    .result-card {
      background: var(--lighter);
      border-radius: var(--border-radius);
      padding: 2rem;
      box-shadow: var(--shadow-lg);
      border-left: 4px solid var(--primary);
      transition: var(--transition);
      text-align: center;
    }

    .result-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .result-icon {
      font-size: 3rem;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: white;
    }

    .safe .result-icon {
      background: var(--success);
    }

    .prohibited .result-icon {
      background: var(--danger);
    }

    .result-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--dark);
    }

    .result-message {
      margin-top: 1rem;
      color: var(--gray);
      font-size: 1.1rem;
    }

    /* Loading */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(67, 97, 238, 0.2);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loading-text {
      color: var(--gray);
      font-weight: 500;
    }

    .hidden {
      display: none;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 1.5rem;
      }
      
      .upload-area {
        padding: 1.5rem;
      }
      
      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>
  
  <div class="container">
    <header>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <i class="fas fa-moon"></i>
      </button>
      <div class="logo">
        <i class="fas fa-shield-alt logo-icon"></i>
        <h1>AI Image Moderation</h1>
      </div>
      <p class="subtitle">Upload images to automatically detect prohibited content using advanced AI analysis</p>
    </header>
    
    <main>
      <div class="upload-area">
        <div class="upload-container" id="uploadContainer">
          <i class="fas fa-cloud-upload-alt upload-icon"></i>
          <div class="upload-text">
            <h3>Drag & Drop your image here</h3>
            <p>or click to browse files (JPEG, PNG, GIF)</p>
          </div>
          <button class="btn" id="uploadBtn">
            <i class="fas fa-upload"></i> Select Image
          </button>
          <input type="file" id="imageInput" class="file-input" accept="image/*">
        </div>
        
        <div class="preview-container hidden" id="previewContainer">
          <img id="previewImage" class="preview-image" src="#" alt="Preview">
        </div>
      </div>
      
      <div class="result-container">
        <div class="result-card hidden" id="resultCard">
          <div class="result-header">
            <div class="result-icon" id="resultIcon">
              <i class="fas fa-check"></i>
            </div>
            <div>
              <h3 class="result-title" id="resultTitle">Analysis Complete</h3>
              <p class="result-message" id="resultMessage">This image meets our content guidelines</p>
            </div>
          </div>
        </div>
        
        <div class="loading hidden" id="loadingIndicator">
          <div class="spinner"></div>
          <p class="loading-text">Analyzing image content...</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Theme toggle functionality
      const themeToggle = document.getElementById('themeToggle');
      const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');
      const currentTheme = localStorage.getItem('theme');
      
      // Set initial theme
      if (currentTheme === 'dark' || (!currentTheme && prefersDarkScheme.matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
      }
      
      // Toggle theme
      themeToggle.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        if (currentTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'light');
          localStorage.setItem('theme', 'light');
          themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          localStorage.setItem('theme', 'dark');
          themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
        }
      });

      // Image upload functionality
      const uploadContainer = document.getElementById('uploadContainer');
      const uploadBtn = document.getElementById('uploadBtn');
      const imageInput = document.getElementById('imageInput');
      const previewContainer = document.getElementById('previewContainer');
      const previewImage = document.getElementById('previewImage');
      const resultCard = document.getElementById('resultCard');
      const resultIcon = document.getElementById('resultIcon');
      const resultTitle = document.getElementById('resultTitle');
      const resultMessage = document.getElementById('resultMessage');
      const loadingIndicator = document.getElementById('loadingIndicator');
      
      // Handle drag and drop
      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        uploadContainer.addEventListener(eventName, preventDefaults, false);
      });
      
      function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
      }
      
      ['dragenter', 'dragover'].forEach(eventName => {
        uploadContainer.addEventListener(eventName, highlight, false);
      });
      
      ['dragleave', 'drop'].forEach(eventName => {
        uploadContainer.addEventListener(eventName, unhighlight, false);
      });
      
      function highlight() {
        uploadContainer.classList.add('active');
      }
      
      function unhighlight() {
        uploadContainer.classList.remove('active');
      }
      
      uploadContainer.addEventListener('drop', handleDrop, false);
      
      function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files.length) {
          imageInput.files = files;
          handleFiles(files);
        }
      }
      
      uploadBtn.addEventListener('click', () => {
        imageInput.click();
      });
      
      imageInput.addEventListener('change', () => {
        if (imageInput.files.length) {
          handleFiles(imageInput.files);
        }
      });
      
      async function handleFiles(files) {
        const file = files[0];
        if (!file.type.match('image.*')) {
          showError('Please select an image file (JPEG, PNG, GIF)');
          return;
        }
        
        // Show preview
        const reader = new FileReader();
        reader.onload = (e) => {
          previewImage.src = e.target.result;
          previewContainer.classList.remove('hidden');
          previewContainer.style.animation = 'fadeIn 0.8s ease-out';
        };
        reader.readAsDataURL(file);
        
        // Reset UI
        resultCard.classList.add('hidden');
        loadingIndicator.classList.remove('hidden');
        
        // Prepare form data
        const formData = new FormData();
        formData.append("file", file);
        
        try {
          // Simulate API call with timeout
          await new Promise(resolve => setTimeout(resolve, 2500));
          
          // For demo purposes, we'll randomly determine if the image is safe or not
          const isSafe = Math.random() > 0.3;
          const data = { status: isSafe ? "Safe" : "Prohibited" };
          
          displayResult(data.status);
        } catch (error) {
          showError(error.message || "An error occurred while processing the image");
        } finally {
          loadingIndicator.classList.add('hidden');
        }
      }
      
      function displayResult(status) {
        // Set result card style based on status
        resultCard.className = status === "Safe" ? 
          "result-card safe" : "result-card prohibited";
        
        // Set icon and title
        const icon = resultIcon.querySelector('i');
        if (status === "Safe") {
          icon.className = "fas fa-check-circle";
          resultTitle.textContent = "✅ Image Approved";
          resultMessage.textContent = "This image meets our content guidelines and is safe for use.";
        } else {
          icon.className = "fas fa-exclamation-circle";
          resultTitle.textContent = "⛔ Content Violation Detected";
          resultMessage.textContent = "This image contains prohibited content that violates our guidelines.";
        }
        
        // Show result card with animation
        resultCard.classList.remove('hidden');
        resultCard.style.animation = 'fadeInUp 0.8s ease-out';
      }
      
      function showError(message) {
        resultCard.className = "result-card prohibited";
        const icon = resultIcon.querySelector('i');
        icon.className = "fas fa-times-circle";
        resultTitle.textContent = "⚠️ Error Processing Image";
        resultMessage.textContent = message;
        
        resultCard.classList.remove('hidden');
        resultCard.style.animation = 'fadeInUp 0.8s ease-out';
      }
    });
  </script>
</body>
</html>
